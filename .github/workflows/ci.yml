name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check each skill has a well-formed SKILL.md
        run: |
          set -e
          fail=0
          for dir in .claude/skills/*/; do
            name=$(basename "$dir")
            file="$dir/SKILL.md"
            if [ ! -f "$file" ]; then
              echo "::error::$name is missing SKILL.md"
              fail=1
              continue
            fi
            if ! head -1 "$file" | grep -q '^---$'; then
              echo "::error file=$file::missing YAML frontmatter (must start with ---)"
              fail=1
            fi
            if ! grep -q '^name:' "$file"; then
              echo "::error file=$file::frontmatter missing 'name:'"
              fail=1
            fi
            if ! grep -q '^description:' "$file"; then
              echo "::error file=$file::frontmatter missing 'description:'"
              fail=1
            fi
          done
          exit $fail

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Run install.sh scripted tests
        run: bash tests/test_install.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate internal doc links and referenced paths
        run: python3 scripts/check_docs_links.py

  example-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run python-cli example tests
        working-directory: examples/python-cli
        run: python -m unittest -v

  example-tests-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/ts-cli/package-lock.json

      - name: Install
        working-directory: examples/ts-cli
        run: npm ci

      - name: Build (tsc)
        working-directory: examples/ts-cli
        run: npm run build

      - name: Type-check (tsc --noEmit)
        working-directory: examples/ts-cli
        run: npm run typecheck

      - name: Run ts-cli example tests
        working-directory: examples/ts-cli
        run: npm test
